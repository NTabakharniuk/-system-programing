<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Students</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
<h2>Student List</h2>

<form th:action="@{/students/add}" th:object="${student}" method="post" class="mb-4">
    <div class="mb-2">
        <label>ID:</label>
        <input type="number" th:field="*{id}" class="form-control"/>
        <span th:if="${#fields.hasErrors('id')}" th:errors="*{id}" class="text-danger"></span>
    </div>
    <div class="mb-2">
        <label>Name:</label>
        <input type="text" th:field="*{name}" class="form-control"/>
        <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger"></span>
    </div>
    <div class="mb-2">
        <label>Age:</label>
        <input type="number" th:field="*{age}" class="form-control"/>
        <span th:if="${#fields.hasErrors('age')}" th:errors="*{age}" class="text-danger"></span>
    </div>
    <button type="submit" class="btn btn-primary">Add Student</button>
</form>

<table class="table table-bordered">
    <thead>
    <tr><th>ID</th><th>Name</th><th>Age</th><th>Actions</th></tr>
    </thead>
    <tbody>
    <tr th:each="s : ${students}">
        <td th:text="${s.id}"></td>
        <td th:text="${s.name}"></td>
        <td th:text="${s.age}"></td>
        <td>
            <a th:href="@{'/students/delete/' + ${s.id}}" class="btn btn-danger btn-sm">Delete</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
